<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Fluxo de Atendimento - Líder Financeira</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h2 { color: #003399; }
    .card { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; background: #003399; color: #fff; padding: 12px; border: none; border-radius: 6px; cursor: pointer; margin-top:5px; }
    button:hover { background: #002080; }
    .list-item { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #003399; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filters select { flex: 1; }
  </style>
</head>
<body>

  <h2>Fluxo Diário de Atendimento</h2>

  <div class="card">
    <label>Nome do Cliente</label>
    <input id="nome" />

    <label>CPF</label>
    <input id="cpf" />

    <label>Telefone</label>
    <input id="telefone" />

    <label>Cidade</label>
    <input id="cidade" />

    <label>Tipo de Atendimento</label>
    <select id="tipo">
      <option value="Contratação">Contratação</option>
      <option value="Reclamação">Reclamação</option>
      <option value="Desbloqueio">Desbloqueio</option>
      <option value="Orçamento">Orçamento</option>
      <option value="Revisão de Margem">Revisão de Margem</option>
      <option value="Consulta Benefício">Consulta Benefício</option>
    </select>

    <label>Observações</label>
    <textarea id="obs"></textarea>

    <button onclick="registrar()">Registrar Atendimento</button>
  </div>

  <h3>Filtros</h3>
  <div class="filters">
    <select id="filtroStatus" onchange="listar()">
      <option value="todos">Todos</option>
      <option value="abertos">Abertos</option>
      <option value="fechados">Fechados</option>
      <option value="agendados">Agendados</option>
    </select>

    <select id="filtroTipo" onchange="listar()">
      <option value="todos">Todos Tipos</option>
      <option value="Contratação">Contratação</option>
      <option value="Reclamação">Reclamação</option>
      <option value="Desbloqueio">Desbloqueio</option>
      <option value="Orçamento">Orçamento</option>
      <option value="Revisão de Margem">Revisão de Margem</option>
      <option value="Consulta Benefício">Consulta Benefício</option>
    </select>
  </div>

  <button onclick="exportarCSV()">Exportar Contatos (CSV)</button>

  <h3>Atendimentos Registrados</h3>
  <div id="lista"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "lider-financeira.firebaseapp.com",
      projectId: "lider-financeira"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function registrar(){
      const dados = {
        nome: nome.value,
        cpf: cpf.value,
        cidade: cidade.value,
        tipo: tipo.value,
        obs: obs.value,
        telefone: telefone.value,
        abertura: new Date().toISOString(),
        status: "aberto",
      };

      db.collection("fluxoAtendimento").add(dados).then(()=>{
        nome.value = cpf.value = cidade.value = telefone.value = obs.value = "";
        listar();
      });
    }

    function fecharAtendimento(id){
      const ag = prompt('Data do próximo contato (obrigatório):');
      if(!ag) return alert('A data é obrigatória.');

      db.collection('fluxoAtendimento').doc(id).update({
        fechamento: new Date().toISOString(),
        agendamento: ag,
        status: "fechado"
      });
    }

    function editar(id, dados){
      const novoNome = prompt("Editar nome", dados.nome);
      const novoTelefone = prompt("Editar telefone", dados.telefone);

      db.collection('fluxoAtendimento').doc(id).update({
        nome: novoNome,
        telefone: novoTelefone
      });
    }

    function exportarCSV(){
      db.collection("fluxoAtendimento").get().then(snapshot=>{
        let csv = "nome,cpf,telefone,cidade,tipo,abertura,fechamento,agendamento\n";
        snapshot.forEach(doc=>{
          const d = doc.data();
          csv += `${d.nome},${d.cpf},${d.telefone},${d.cidade},${d.tipo},${d.abertura},${d.fechamento || ''},${d.agendamento || ''}\n`;
        });
        const blob = new Blob([csv], {type:"text/csv"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "atendimentos.csv";
        a.click();
      });
    }

    function listar(){
      const filtroStatus = filtroStatus.value;
      const filtroTipo = filtroTipo.value;

      db.collection("fluxoAtendimento")
        .orderBy("abertura","desc")
        .onSnapshot(res=>{
          let html = "";
          res.forEach(doc=>{
            const d = doc.data();

            if(filtroStatus !== "todos"){
              if(filtroStatus === "abertos" && d.status !== "aberto") return;
              if(filtroStatus === "fechados" && d.status !== "fechado") return;
              if(filtroStatus === "agendados" && !d.agendamento) return;
            }

            if(filtroTipo !== "todos" && d.tipo !== filtroTipo) return;

            html += `
              <div class='list-item'>
                <strong>${d.nome}</strong> (${d.cpf})<br>
                ${d.telefone} • ${d.cidade}<br>
                ${d.tipo}<br>
                Status: <b>${d.status || 'aberto'}</b><br>
                <small>Abertura: ${new Date(d.abertura).toLocaleString()}</small><br>
                ${d.agendamento ? `<small>Agendado: ${d.agendamento}</small><br>` : ''}
                <em>${d.obs}</em><br><br>

                <button onclick="fecharAtendimento('${doc.id}')">Fechar Atendimento</button>
                <button onclick="editar('${doc.id}', ${JSON.stringify(d).replace(/"/g,'&quot;')})">Editar</button>
              </div>`;
          });

          lista.innerHTML = html;
        });
    }

    listar();
  </script>

</body>
</html>
